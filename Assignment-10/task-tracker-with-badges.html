<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taskflow | My Tasks</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="task-tracker-with-badges.css">
</head>
<body>
<header class="bg-primary text-white py-4"><div class="container d-flex justify-content-between align-items-center"><div><h1 class="h3 fw-bold mb-1">Taskflow</h1><p class="mb-0">Your day, organized.</p></div><span class="badge bg-warning text-dark fs-6">5 pending</span></div></header>
<main class="container py-5"><div class="row justify-content-center"><div class="col-lg-8"><div class="d-flex justify-content-between align-items-center mb-3"><h2 class="h4 mb-0">Today's tasks</h2><span class="text-secondary">Friday, 6 November</span></div>
<ul class="list-group shadow-sm">
<li class="list-group-item d-flex justify-content-between align-items-center py-3"><span>Finalize project proposal</span><span class="badge bg-danger rounded-pill">High</span></li>
<li class="list-group-item d-flex justify-content-between align-items-center py-3"><span>Review design feedback</span><span class="badge bg-warning text-dark rounded-pill">Medium</span></li>
<li class="list-group-item d-flex justify-content-between align-items-center py-3"><span>Organize reference files</span><span class="badge bg-success rounded-pill">Low</span></li>
<li class="list-group-item d-flex justify-content-between align-items-center py-3"><span>Send weekly update</span><span class="badge bg-danger rounded-pill">High</span></li>
<li class="list-group-item d-flex justify-content-between align-items-center py-3"><span>Plan next week's goals</span><span class="badge bg-warning text-dark rounded-pill">Medium</span></li>
</ul>
<div class="text-end mt-4"><button class="btn btn-outline-success" type="button">Completed <span class="badge bg-success ms-1">3</span></button></div>
</div></div></main><footer class="text-center text-secondary py-4">Small steps make great progress.</footer>
</body>
</html>
